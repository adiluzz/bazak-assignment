services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build: .
    ports:
      - "8000:8000"
    environment: &app
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/shop
      CHECKPOINT_URL: postgresql://postgres:postgres@db:5432/shop
      REDIS_URL: redis://redis:6379/0
      CATALOG_SOURCE_URL: https://dummyjson.com
      SYNC_MODE: celery
      SYNC_INTERVAL_MINUTES: "60"
      FAKE_LLM: "1"
      EMBED_MODE: hash
      AUTO_SYNC: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - db
      - redis
  worker:
    build: .
    command: celery -A api.worker.celery_app worker --loglevel=info
    environment: *app
    depends_on:
      - db
      - redis
  beat:
    build: .
    command: celery -A api.worker.celery_app beat --loglevel=info
    environment: *app
    depends_on:
      - redis
volumes:
  pgdata:
